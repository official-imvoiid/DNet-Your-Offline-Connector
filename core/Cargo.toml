[package]
name = "dnet_core"
version = "0.1.0"
edition = "2021"
description = "Identity, encryption and storage for DNet. No user interface and no radio code."
publish = false

[lib]
# cdylib: the library the Flutter app loads. lib: for the tests.
crate-type = ["lib", "cdylib"]

# Every crate here does cryptography or holds user data, so each one has to
# be maintained and worth reviewing. All are pure Rust, which is what lets
# the core build for Android and Windows with nothing but a linker.
[dependencies]
ed25519-dalek = { version = "3.0", features = ["zeroize"] }
aes-gcm = "0.11"
# For the app lock: turns a passcode into something that cannot be turned
# back. Pure Rust, from the RustCrypto project.
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
hkdf = "0.13"
sha2 = "0.11"
getrandom = "0.4"
zeroize = { version = "1.9", features = ["derive"] }
redb = "4.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
# Pinned exactly: its X-Wing follows a draft standard, and a change to the
# draft would change what goes over the air.
hpke = { version = "=0.14.1", default-features = false, features = ["alloc", "aes", "hkdfsha2", "mlkem", "x25519", "getrandom"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
# A panic inside the core must not unwind into Dart.
panic = "abort"
lto = true
codegen-units = 1
strip = true
