<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Welcome</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
html{background:#1C1D22}
body{margin:0}
button{font:inherit;cursor:pointer}
input{font:inherit}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #1C1D22; color: #F2F3F5; font-family: 'Figtree', system-ui, sans-serif; font-size: 15px; line-height: 1.4; overflow: hidden">
<div style="padding: 56px 24px 0; display: flex; flex-direction: column; gap: 14px">
<img src="../logo.png" alt="" style="width: 64px; height: 64px; border-radius: 20px; display: block">
<h1 style="margin: 0; font-size: 40px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.05">DNet</h1>
<p style="margin: 0; color: #B3B6C0; font-size: 18px">Chat with people around you. No signal needed.</p>
</div>
<div style="padding: 30px 24px 0; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; align-items: center; gap: 14px">
<div style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; background: #2D2F36; color: #4DA3FF; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="2"></circle><path d="M7.8 7.8a6 6 0 0 0 0 8.4M16.2 7.8a6 6 0 0 1 0 8.4M4.9 4.9a10 10 0 0 0 0 14.2M19.1 4.9a10 10 0 0 1 0 14.2"></path></svg></div>
<div>
<div style="font-weight: 700; font-size: 16px">Works without internet</div>
<div style="color: #B3B6C0; font-size: 14px">Phones nearby pass messages along.</div>
</div>
</div>
<div style="display: flex; align-items: center; gap: 14px">
<div style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; background: #2D2F36; color: #4DA3FF; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg></div>
<div>
<div style="font-weight: 700; font-size: 16px">Private by default</div>
<div style="color: #B3B6C0; font-size: 14px">No phone number. No account. Encrypted.</div>
</div>
</div>
<div style="display: flex; align-items: center; gap: 14px">
<div style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; background: #2D2F36; color: #4DA3FF; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5Z"></path><path d="M14 3v5h5"></path></svg></div>
<div>
<div style="font-weight: 700; font-size: 16px">Sends big files fast</div>
<div style="color: #B3B6C0; font-size: 14px">Straight from phone to phone over Wi-Fi.</div>
</div>
</div>
</div>
<div style="flex-grow: 1"></div>
<div style="padding: 0 24px 28px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="name" style="font-weight: 600">Your name</label>
<div style="display: flex; gap: 8px">
<input id="name" type="text" value="Asha" style="flex-grow: 1; min-width: 0; height: 52px; box-sizing: border-box; padding: 0 16px; border: 1px solid #383A42; border-radius: 14px; background: #24252B; color: #F2F3F5; font-size: 17px; outline: none">
<button style="height: 52px; padding: 0 18px; border-radius: 14px; border: 0; background: #2D2F36; color: #F2F3F5; font-weight: 600; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px"><span>Random</span></button>
</div>
</div>
<button style="height: 52px; padding: 0 18px; border-radius: 14px; border: 0; background: #4DA3FF; color: #0B1A2B; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px"><span>Get started</span></button>
<div style="color: #8E919C; font-size: 13px; text-align: center">Your key is made on this phone and stays here.</div>
</div>
</div>
</body>
</html>
