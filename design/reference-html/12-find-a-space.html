<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Find a space</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
html{background:#1C1D22}
body{margin:0}
button{font:inherit;cursor:pointer}
input{font:inherit}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #1C1D22; color: #F2F3F5; font-family: 'Figtree', system-ui, sans-serif; font-size: 15px; line-height: 1.4; overflow: hidden">
<header style="flex-shrink: 0; min-height: 56px; box-sizing: border-box; padding: 6px 8px; display: flex; align-items: center; gap: 2px">
<button aria-label="Back" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 12px; background: transparent; color: #F2F3F5; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></button>

<div style="flex-grow: 1; min-width: 0; padding-left: 2px">
<h1 style="margin: 0; font-size: 18px; font-weight: 700; line-height: 1.25; display: flex; align-items: center; gap: 6px">Find a space</h1>

</div>

</header>
<div style="flex-grow: 1; min-height: 0; padding: 4px 16px 0; display: flex; flex-direction: column; gap: 16px">
<div style="height: 48px; padding: 0 14px; border-radius: 14px; background: #24252B; display: flex; align-items: center; gap: 10px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B3B6C0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<label for="find" style="position: absolute; width: 1px; height: 1px; overflow: hidden">Search public spaces</label>
<input id="find" type="text" placeholder="Search public spaces" style="flex-grow: 1; min-width: 0; height: 44px; border: 0; background: transparent; color: #F2F3F5; font-size: 16px; outline: none">
</div>
<div style="padding: 0 4px; display: flex; flex-direction: column">
<div style="color: #B3B6C0; font-size: 13px; font-weight: 600">Public, anyone can join</div>
<div style="min-height: 72px; border-bottom: 1px solid #383A42; display: flex; align-items: center; gap: 12px">
<div style="position: relative; width: 48px; height: 48px; flex-shrink: 0"><div style="width: 48px; height: 48px; border-radius: 16px; background: #6A5216; color: #FFE9A8; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 19px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFE9A8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10v4h3l8 4V6L6 10H3ZM17 9a4 4 0 0 1 0 6"></path></svg></div></div>
<div style="flex-grow: 1; min-width: 0">
<div style="font-weight: 700; font-size: 16px">City Signal</div>
<div style="color: #B3B6C0; font-size: 13px">Channel. Road and transit updates.</div>
</div>
<button style="height: 44px; padding: 0 16px; border-radius: 12px; border: 0; background: #2D2F36; color: #F2F3F5; font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px"><span>Open</span></button>
</div>
<div style="min-height: 72px; border-bottom: 1px solid #383A42; display: flex; align-items: center; gap: 12px">
<div style="position: relative; width: 48px; height: 48px; flex-shrink: 0"><div style="width: 48px; height: 48px; border-radius: 16px; background: #1D5560; color: #C5F1F7; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 19px">OR</div></div>
<div style="flex-grow: 1; min-width: 0">
<div style="font-weight: 700; font-size: 16px">Open Radio</div>
<div style="color: #B3B6C0; font-size: 13px">Community. Antennas and meetups.</div>
</div>
<button style="height: 44px; padding: 0 18px; border-radius: 12px; border: 0; background: #4DA3FF; color: #0B1A2B; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px"><span>Join</span></button>
</div>
<div style="min-height: 72px; display: flex; align-items: center; gap: 12px">
<div style="position: relative; width: 48px; height: 48px; flex-shrink: 0"><div style="width: 48px; height: 48px; border-radius: 16px; background: #2B4E7A; color: #CFE4FF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 19px">NS</div></div>
<div style="flex-grow: 1; min-width: 0">
<div style="font-weight: 700; font-size: 16px">Night Sky Watch</div>
<div style="color: #B3B6C0; font-size: 13px">Community. Stargazing plans.</div>
</div>
<button style="height: 44px; padding: 0 18px; border-radius: 12px; border: 0; background: #4DA3FF; color: #0B1A2B; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px"><span>Join</span></button>
</div>
<div style="padding-top: 6px; color: #8E919C; font-size: 13px">Shared by phones around you. There is no central list.</div>
</div>
<div style="padding: 14px; border-radius: 16px; background: #24252B; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 12px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B3B6C0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
<div>
<div style="font-weight: 700">Have an invite?</div>
<div style="color: #B3B6C0; font-size: 13px">Private spaces never show up in search.</div>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button style="height: 46px; padding: 0 18px; border-radius: 12px; border: 0; background: #2D2F36; color: #F2F3F5; font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px"><span>Paste link</span></button>
<button style="height: 46px; padding: 0 18px; border-radius: 12px; border: 0; background: #2D2F36; color: #F2F3F5; font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px"><span>Scan code</span></button>
</div>
</div>
</div>
<div style="flex-shrink: 0; padding: 12px 16px 26px; display: flex; flex-direction: column">
<button style="height: 52px; padding: 0 18px; border-radius: 14px; border: 0; background: #2D2F36; color: #F2F3F5; font-weight: 600; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg><span>Create a space</span></button>
</div>
</div>
</body>
</html>
