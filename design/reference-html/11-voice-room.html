<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Voice room</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
html{background:#1C1D22}
body{margin:0}
button{font:inherit;cursor:pointer}
input{font:inherit}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #1C1D22; color: #F2F3F5; font-family: 'Figtree', system-ui, sans-serif; font-size: 15px; line-height: 1.4; overflow: hidden">
<header style="flex-shrink: 0; min-height: 56px; box-sizing: border-box; padding: 6px 8px; display: flex; align-items: center; gap: 2px">
<button aria-label="Back" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 12px; background: transparent; color: #F2F3F5; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></button>

<div style="flex-grow: 1; min-width: 0; padding-left: 2px">
<h1 style="margin: 0; font-size: 18px; font-weight: 700; line-height: 1.25; display: flex; align-items: center; gap: 6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B3B6C0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4ZM16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"></path></svg><span>Campfire</span></h1>
<div style="color: #B3B6C0; font-size: 13px">Trek Team voice room</div>
</div>
<button aria-label="Invite to room" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 12px; background: transparent; color: #F2F3F5; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="8" r="4"></circle><path d="M2 21a8 8 0 0 1 13-6M19 14v6M16 17h6"></path></svg></button>
</header>
<div style="flex-grow: 1; min-height: 0; padding: 6px 20px 0; display: flex; flex-direction: column; gap: 14px">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div style="height: 156px; border-radius: 20px; background: #24252B; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px">
<div style="position: relative; width: 64px; height: 64px; flex-shrink: 0"><div style="width: 64px; height: 64px; border-radius: 32px; background: #2B4E7A; color: #CFE4FF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 26px; box-shadow: 0 0 0 3px #24252B, 0 0 0 6px #3DD68C">D</div></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px"><div style="font-weight: 700">Dev</div><div style="color: #3DD68C; font-size: 13px; font-weight: 600">Speaking</div></div>
</div>
<div style="height: 156px; border-radius: 20px; background: #24252B; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px">
<div style="position: relative; width: 64px; height: 64px; flex-shrink: 0"><div style="width: 64px; height: 64px; border-radius: 32px; background: #6B2F45; color: #FFD3E0; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 26px">M</div></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px"><div style="font-weight: 700">Mira</div><div style="color: #B3B6C0; font-size: 13px">Listening</div></div>
</div>
<div style="height: 156px; border-radius: 20px; background: #24252B; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px">
<div style="position: relative; width: 64px; height: 64px; flex-shrink: 0"><div style="width: 64px; height: 64px; border-radius: 32px; background: #4A3B78; color: #E0D6FF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 26px">N</div></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px"><div style="font-weight: 700">Noor</div><div style="color: #B3B6C0; font-size: 13px; display: flex; align-items: center; gap: 6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3M4 4l16 16"></path></svg><span>Muted</span></div></div>
</div>
<div style="height: 156px; border-radius: 20px; background: #24252B; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px">
<div style="position: relative; width: 64px; height: 64px; flex-shrink: 0"><div style="width: 64px; height: 64px; border-radius: 32px; background: #1F5A45; color: #C9F5DF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 26px">A</div></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px"><div style="font-weight: 700">You</div><div style="color: #B3B6C0; font-size: 13px; display: flex; align-items: center; gap: 6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3M4 4l16 16"></path></svg><span>Muted</span></div></div>
</div>
</div>
<div style="padding: 14px 16px; border-radius: 16px; background: #24252B; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; gap: 8px; color: #B3B6C0; font-size: 13px; font-weight: 600"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#3DD68C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6l-8-3Z"></path><path d="m9 12 2 2 4-4"></path></svg><span>Call key</span></div>
<div style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 16px">river copper seven lantern</div>
<div style="color: #B3B6C0; font-size: 13px">If everyone sees these words, nobody is listening in.</div>
</div>
</div>
<div style="flex-shrink: 0; padding: 14px 28px 30px; display: flex; align-items: center; justify-content: space-between">
<button aria-label="Unmute microphone" style="width: 60px; height: 60px; border: 0; border-radius: 50%; background: #2D2F36; color: #F2F3F5; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3M4 4l16 16"></path></svg></button>
<button aria-label="Speaker" style="width: 60px; height: 60px; border: 0; border-radius: 50%; background: #2D2F36; color: #F2F3F5; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4ZM16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"></path></svg></button>
<button aria-label="Turn camera on" style="width: 60px; height: 60px; border: 0; border-radius: 50%; background: #2D2F36; color: #F2F3F5; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="2"></rect><path d="m16 10 5-3v10l-5-3"></path></svg></button>
<button aria-label="Leave the room" style="width: 60px; height: 60px; border: 0; border-radius: 50%; background: #FF6B6B; color: #2B0F10; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
</div>
</div>
</body>
</html>
