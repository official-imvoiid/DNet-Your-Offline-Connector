<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Space</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
html{background:#1C1D22}
body{margin:0}
button{font:inherit;cursor:pointer}
input{font:inherit}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #1C1D22; color: #F2F3F5; font-family: 'Figtree', system-ui, sans-serif; font-size: 15px; line-height: 1.4; overflow: hidden">
<div style="flex-grow: 1; min-height: 0; display: flex">
<nav aria-label="Spaces" style="width: 72px; flex-shrink: 0; box-sizing: border-box; padding: 14px 0; background: #24252B; display: flex; flex-direction: column; align-items: center; gap: 12px">
<button aria-label="Trek Team" style="width: 48px; height: 48px; padding: 0; border: 0; border-radius: 16px; background: #1F5A45; color: #C9F5DF; font-weight: 800; font-size: 15px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 3px #24252B, 0 0 0 5px #4DA3FF">TT</button>
<button aria-label="Radio Club" style="width: 48px; height: 48px; padding: 0; border: 0; border-radius: 16px; background: #4A3B78; color: #E0D6FF; font-weight: 800; font-size: 15px; display: flex; align-items: center; justify-content: center">RC</button>
<button aria-label="City Signal" style="width: 48px; height: 48px; padding: 0; border: 0; border-radius: 16px; background: #6A5216; color: #FFE9A8; font-weight: 800; font-size: 15px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10v4h3l8 4V6L6 10H3ZM17 9a4 4 0 0 1 0 6"></path></svg></button>
<div style="width: 28px; height: 1px; background: #383A42"></div>
<button aria-label="Find or create a space" style="width: 48px; height: 48px; padding: 0; border: 1px dashed #8E919C; border-radius: 16px; background: transparent; color: #B3B6C0; font-weight: 800; font-size: 15px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</nav>
<main style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column">
<header style="flex-shrink: 0; padding: 16px 8px 12px 16px; display: flex; align-items: flex-start; gap: 4px">
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 22px; font-weight: 800">Trek Team</h1>
<div style="display: flex; align-items: center; gap: 8px; color: #B3B6C0; font-size: 13px"><span style="flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 8px; background: #2D2F36; color: #B3B6C0; font-size: 12px; font-weight: 600"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>Private</span><span>6 members</span></div>
</div>
<button aria-label="Invite someone" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 12px; background: transparent; color: #F2F3F5; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="8" r="4"></circle><path d="M2 21a8 8 0 0 1 13-6M19 14v6M16 17h6"></path></svg></button>
</header>
<div style="flex-grow: 1; min-height: 0; padding: 0 8px; display: flex; flex-direction: column; gap: 2px">
<div style="color: #B3B6C0; font-size: 13px; font-weight: 600; padding: 6px 10px 2px">Info</div>
<button style="height: 44px; padding: 0 10px; border: 0; border-radius: 10px; background: transparent; color: #B3B6C0; font-weight: 500; text-align: left; display: flex; align-items: center; gap: 10px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10v4h3l8 4V6L6 10H3ZM17 9a4 4 0 0 1 0 6"></path></svg><span style="flex-grow: 1">announcements</span></button>
<button style="height: 44px; padding: 0 10px; border: 0; border-radius: 10px; background: transparent; color: #B3B6C0; font-weight: 500; text-align: left; display: flex; align-items: center; gap: 10px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9h14M5 15h14M10 4 8 20M16 4l-2 16"></path></svg><span style="flex-grow: 1">rules</span></button>
<div style="color: #B3B6C0; font-size: 13px; font-weight: 600; padding: 10px 10px 2px">Text</div>
<button style="height: 44px; padding: 0 10px; border: 0; border-radius: 10px; background: #34363E; color: #F2F3F5; font-weight: 700; text-align: left; display: flex; align-items: center; gap: 10px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9h14M5 15h14M10 4 8 20M16 4l-2 16"></path></svg><span style="flex-grow: 1">general</span><span style="min-width: 22px; height: 22px; box-sizing: border-box; padding: 0 6px; border-radius: 11px; background: #4DA3FF; color: #0B1A2B; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">5</span></button>
<button style="height: 44px; padding: 0 10px; border: 0; border-radius: 10px; background: transparent; color: #B3B6C0; font-weight: 500; text-align: left; display: flex; align-items: center; gap: 10px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9h14M5 15h14M10 4 8 20M16 4l-2 16"></path></svg><span style="flex-grow: 1">photos</span></button>
<button style="height: 44px; padding: 0 10px; border: 0; border-radius: 10px; background: transparent; color: #B3B6C0; font-weight: 500; text-align: left; display: flex; align-items: center; gap: 10px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9h14M5 15h14M10 4 8 20M16 4l-2 16"></path></svg><span style="flex-grow: 1">routes</span></button>
<div style="color: #B3B6C0; font-size: 13px; font-weight: 600; padding: 10px 10px 2px">Voice</div>
<button style="height: 44px; padding: 0 10px; border: 0; border-radius: 10px; background: transparent; color: #B3B6C0; font-weight: 500; text-align: left; display: flex; align-items: center; gap: 10px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4ZM16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"></path></svg><span style="flex-grow: 1">Campfire</span><span style="color: #3DD68C; font-size: 13px; font-weight: 600">3 talking</span></button>
<div style="height: 34px; padding: 0 10px 0 38px; display: flex; align-items: center; gap: 10px; color: #F2F3F5; font-size: 14px"><div style="position: relative; width: 24px; height: 24px; flex-shrink: 0"><div style="width: 24px; height: 24px; border-radius: 12px; background: #2B4E7A; color: #CFE4FF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 10px; box-shadow: 0 0 0 3px #1C1D22, 0 0 0 6px #3DD68C">D</div></div><span>Dev</span></div>
<div style="height: 34px; padding: 0 10px 0 38px; display: flex; align-items: center; gap: 10px; color: #B3B6C0; font-size: 14px"><div style="position: relative; width: 24px; height: 24px; flex-shrink: 0"><div style="width: 24px; height: 24px; border-radius: 12px; background: #6B2F45; color: #FFD3E0; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 10px">M</div></div><span>Mira</span></div>
<div style="height: 34px; padding: 0 10px 0 38px; display: flex; align-items: center; gap: 10px; color: #B3B6C0; font-size: 14px"><div style="position: relative; width: 24px; height: 24px; flex-shrink: 0"><div style="width: 24px; height: 24px; border-radius: 12px; background: #4A3B78; color: #E0D6FF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 10px">N</div></div><span>Noor</span></div>
<button style="height: 44px; padding: 0 10px; border: 0; border-radius: 10px; background: transparent; color: #B3B6C0; font-weight: 500; text-align: left; display: flex; align-items: center; gap: 10px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4ZM16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"></path></svg><span style="flex-grow: 1">Planning</span></button>
<div style="flex-grow: 1"></div>
<div style="padding: 0 10px 12px; color: #8E919C; font-size: 13px; display: flex; align-items: center; gap: 8px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3DD68C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6l-8-3Z"></path><path d="m9 12 2 2 4-4"></path></svg><span>Kept on members' phones. No server.</span></div>
</div>
</main>
</div>
<nav aria-label="Main" style="flex-shrink: 0; padding: 6px 12px 14px; border-top: 1px solid #383A42; background: #24252B; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
<button style="height: 52px; border: 0; border-radius: 14px; background: transparent; color: #B3B6C0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"></path></svg><span>Chats</span></button>
<button style="height: 52px; border: 0; border-radius: 14px; background: #2D2F36; color: #F2F3F5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 700"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4DA3FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9h14M5 15h14M10 4 8 20M16 4l-2 16"></path></svg><span>Spaces</span></button>
<button style="height: 52px; border: 0; border-radius: 14px; background: transparent; color: #B3B6C0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="2"></circle><path d="M7.8 7.8a6 6 0 0 0 0 8.4M16.2 7.8a6 6 0 0 1 0 8.4M4.9 4.9a10 10 0 0 0 0 14.2M19.1 4.9a10 10 0 0 1 0 14.2"></path></svg><span>Nearby</span></button>
<button style="height: 52px; border: 0; border-radius: 14px; background: transparent; color: #B3B6C0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg><span>You</span></button>
</nav>
</div>
</body>
</html>
