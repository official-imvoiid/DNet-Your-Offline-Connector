<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Chats</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
html{background:#1C1D22}
body{margin:0}
button{font:inherit;cursor:pointer}
input{font:inherit}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #1C1D22; color: #F2F3F5; font-family: 'Figtree', system-ui, sans-serif; font-size: 15px; line-height: 1.4; overflow: hidden">
<header style="flex-shrink: 0; padding: 14px 8px 6px 20px; display: flex; align-items: center; gap: 2px">
<h1 style="margin: 0; flex-grow: 1; font-size: 28px; font-weight: 800; letter-spacing: -0.01em">Chats</h1>
<button aria-label="Search" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 12px; background: transparent; color: #F2F3F5; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></button>
<button aria-label="New chat request" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 12px; background: transparent; color: #F2F3F5; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="8" r="4"></circle><path d="M2 21a8 8 0 0 1 13-6M19 14v6M16 17h6"></path></svg></button>
</header>
<button style="flex-shrink: 0; margin: 6px 16px 8px; min-height: 64px; padding: 0 14px; border: 0; border-radius: 16px; background: #24252B; color: #F2F3F5; text-align: left; display: flex; align-items: center; gap: 12px">
<div style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 50%; background: #3D3218; color: #F5C451; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="8" r="4"></circle><path d="M2 21a8 8 0 0 1 13-6M19 14v6M16 17h6"></path></svg></div>
<div style="flex-grow: 1; min-width: 0">
<div style="font-weight: 700">2 chat requests</div>
<div style="color: #B3B6C0; font-size: 13px">Tap to answer</div>
</div>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8E919C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
</button>
<div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column">
<button style="min-height: 72px; padding: 0 20px; border: 0; background: transparent; color: #F2F3F5; text-align: left; display: flex; align-items: center; gap: 14px">
<div style="position: relative; width: 48px; height: 48px; flex-shrink: 0"><div style="width: 48px; height: 48px; border-radius: 24px; background: #6B2F45; color: #FFD3E0; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 19px">M</div><span style="position: absolute; right: -2px; bottom: -2px; width: 14px; height: 14px; box-sizing: border-box; border: 3px solid #1C1D22; border-radius: 50%; background: #3DD68C"></span></div>
<div style="flex-grow: 1; min-width: 0">
<div style="display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 16px"><span>Mira</span><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#3DD68C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Verified" role="img" style="flex-shrink: 0"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6l-8-3Z"></path><path d="m9 12 2 2 4-4"></path></svg></div>
<div style="color: #B3B6C0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Voice message, 0:14</div>
</div>
<div style="flex-shrink: 0; align-self: stretch; box-sizing: border-box; padding: 16px 0; display: flex; flex-direction: column; align-items: flex-end; gap: 6px">
<span style="color: #8E919C; font-size: 12px">10:45</span>
<span style="min-width: 22px; height: 22px; box-sizing: border-box; padding: 0 6px; border-radius: 11px; background: #4DA3FF; color: #0B1A2B; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">2</span>
</div>
</button>
<button style="min-height: 72px; padding: 0 20px; border: 0; background: transparent; color: #F2F3F5; text-align: left; display: flex; align-items: center; gap: 14px">
<div style="position: relative; width: 48px; height: 48px; flex-shrink: 0"><div style="width: 48px; height: 48px; border-radius: 24px; background: #2B4E7A; color: #CFE4FF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 19px">D</div><span style="position: absolute; right: -2px; bottom: -2px; width: 14px; height: 14px; box-sizing: border-box; border: 3px solid #1C1D22; border-radius: 50%; background: #3DD68C"></span></div>
<div style="flex-grow: 1; min-width: 0">
<div style="display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 16px"><span>Dev</span><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#3DD68C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Verified" role="img" style="flex-shrink: 0"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6l-8-3Z"></path><path d="m9 12 2 2 4-4"></path></svg></div>
<div style="color: #B3B6C0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">I will bring the spare battery.</div>
</div>
<div style="flex-shrink: 0; align-self: stretch; box-sizing: border-box; padding: 16px 0; display: flex; flex-direction: column; align-items: flex-end; gap: 6px">
<span style="color: #8E919C; font-size: 12px">10:12</span>

</div>
</button>
<button style="min-height: 72px; padding: 0 20px; border: 0; background: transparent; color: #F2F3F5; text-align: left; display: flex; align-items: center; gap: 14px">
<div style="position: relative; width: 48px; height: 48px; flex-shrink: 0"><div style="width: 48px; height: 48px; border-radius: 24px; background: #4A3B78; color: #E0D6FF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 19px">N</div></div>
<div style="flex-grow: 1; min-width: 0">
<div style="display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 16px"><span>Noor</span><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#3DD68C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Verified" role="img" style="flex-shrink: 0"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6l-8-3Z"></path><path d="m9 12 2 2 4-4"></path></svg><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8E919C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l3 2M9 2h6"></path></svg></div>
<div style="color: #B3B6C0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Photo</div>
</div>
<div style="flex-shrink: 0; align-self: stretch; box-sizing: border-box; padding: 16px 0; display: flex; flex-direction: column; align-items: flex-end; gap: 6px">
<span style="color: #8E919C; font-size: 12px">Tue</span>

</div>
</button>
<button style="min-height: 72px; padding: 0 20px; border: 0; background: transparent; color: #F2F3F5; text-align: left; display: flex; align-items: center; gap: 14px">
<div style="position: relative; width: 48px; height: 48px; flex-shrink: 0"><div style="width: 48px; height: 48px; border-radius: 24px; background: #3A3C44; color: #F2F3F5; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 19px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F2F3F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4V3Z"></path></svg></div></div>
<div style="flex-grow: 1; min-width: 0">
<div style="display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 16px"><span>Saved messages</span></div>
<div style="color: #B3B6C0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Only on this phone</div>
</div>
<div style="flex-shrink: 0; align-self: stretch; box-sizing: border-box; padding: 16px 0; display: flex; flex-direction: column; align-items: flex-end; gap: 6px">
<span style="color: #8E919C; font-size: 12px"></span>

</div>
</button>
<div style="flex-grow: 1"></div>
<div style="padding: 0 20px 14px; color: #8E919C; font-size: 13px">Only people you accepted can message you here.</div>
</div>
<nav aria-label="Main" style="flex-shrink: 0; padding: 6px 12px 14px; border-top: 1px solid #383A42; background: #24252B; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
<button style="height: 52px; border: 0; border-radius: 14px; background: #2D2F36; color: #F2F3F5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 700"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4DA3FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"></path></svg><span>Chats</span></button>
<button style="height: 52px; border: 0; border-radius: 14px; background: transparent; color: #B3B6C0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9h14M5 15h14M10 4 8 20M16 4l-2 16"></path></svg><span>Spaces</span></button>
<button style="height: 52px; border: 0; border-radius: 14px; background: transparent; color: #B3B6C0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="2"></circle><path d="M7.8 7.8a6 6 0 0 0 0 8.4M16.2 7.8a6 6 0 0 1 0 8.4M4.9 4.9a10 10 0 0 0 0 14.2M19.1 4.9a10 10 0 0 1 0 14.2"></path></svg><span>Nearby</span></button>
<button style="height: 52px; border: 0; border-radius: 14px; background: transparent; color: #B3B6C0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg><span>You</span></button>
</nav>
</div>
</body>
</html>
