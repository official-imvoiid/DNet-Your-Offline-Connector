<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Verify a person</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
html{background:#1C1D22}
body{margin:0}
button{font:inherit;cursor:pointer}
input{font:inherit}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #1C1D22; color: #F2F3F5; font-family: 'Figtree', system-ui, sans-serif; font-size: 15px; line-height: 1.4; overflow: hidden">
<header style="flex-shrink: 0; min-height: 56px; box-sizing: border-box; padding: 6px 8px; display: flex; align-items: center; gap: 2px">
<button aria-label="Back" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 12px; background: transparent; color: #F2F3F5; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></button>

<div style="flex-grow: 1; min-width: 0; padding-left: 2px">
<h1 style="margin: 0; font-size: 18px; font-weight: 700; line-height: 1.25; display: flex; align-items: center; gap: 6px">Verify Kabir</h1>

</div>

</header>
<div style="flex-grow: 1; min-height: 0; padding: 4px 20px 0; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; align-items: center; gap: 14px">
<div style="position: relative; width: 56px; height: 56px; flex-shrink: 0"><div style="width: 56px; height: 56px; border-radius: 28px; background: #6A5216; color: #FFE9A8; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 22px">K</div></div>
<div style="color: #B3B6C0">Compare these four words in person or on a call. If they match, this really is Kabir's phone.</div>
</div>
<div style="padding: 22px 16px; border-radius: 20px; background: #24252B; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 12px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 20px; text-align: center">
<span>river</span>
<span>copper</span>
<span>seven</span>
<span>lantern</span>
</div>
<button style="height: 52px; padding: 0 18px; border-radius: 14px; border: 0; background: #2D2F36; color: #F2F3F5; font-weight: 600; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><path d="M14 14h3v3h-3zM20 14v3M14 20h3M20 20h1"></path></svg><span>Scan Kabir's code instead</span></button>
</div>
<div style="flex-shrink: 0; padding: 12px 20px 26px; display: flex; flex-direction: column; gap: 12px">
<button style="height: 52px; padding: 0 18px; border-radius: 14px; border: 0; background: #3DD68C; color: #0B2A1C; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg><span>The words match</span></button>
<button style="height: 52px; padding: 0 18px; border-radius: 14px; border: 1px solid #FF6B6B; background: transparent; color: #FF6B6B; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px"><span>They do not match</span></button>
<div style="color: #8E919C; font-size: 13px; text-align: center">Until you verify, Kabir keeps a yellow "Not verified" tag.</div>
</div>
</div>
</body>
</html>
