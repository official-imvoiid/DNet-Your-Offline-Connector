<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>File transfer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
html{background:#1C1D22}
body{margin:0}
button{font:inherit;cursor:pointer}
input{font:inherit}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #1C1D22; color: #F2F3F5; font-family: 'Figtree', system-ui, sans-serif; font-size: 15px; line-height: 1.4; overflow: hidden">
<header style="flex-shrink: 0; min-height: 56px; box-sizing: border-box; padding: 6px 8px; display: flex; align-items: center; gap: 2px">
<button aria-label="Back" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 12px; background: transparent; color: #F2F3F5; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></button>

<div style="flex-grow: 1; min-width: 0; padding-left: 2px">
<h1 style="margin: 0; font-size: 18px; font-weight: 700; line-height: 1.25; display: flex; align-items: center; gap: 6px">Sending file</h1>

</div>

</header>
<div style="flex-grow: 1; min-height: 0; padding: 4px 20px 0; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; align-items: center; gap: 14px">
<div style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 16px; background: #2D2F36; color: #4DA3FF; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="2"></rect><path d="m16 10 5-3v10l-5-3"></path></svg></div>
<div style="min-width: 0">
<div style="font-weight: 700; font-size: 17px">ridge-timelapse.mp4</div>
<div style="color: #B3B6C0; font-size: 14px">4.2 GB, to Dev</div>
</div>
</div>
<div style="padding: 20px; border-radius: 20px; background: #24252B; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px">
<span style="font-size: 56px; font-weight: 800; line-height: 1; letter-spacing: -0.02em">62%</span>
<span style="padding-bottom: 6px; color: #4DA3FF; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 18px">24 MB/s</span>
</div>
<div style="height: 10px; border-radius: 5px; background: #2D2F36; overflow: hidden"><div style="width: 62%; height: 10px; border-radius: 5px; background: #4DA3FF"></div></div>
<div style="display: flex; justify-content: space-between; color: #B3B6C0; font-size: 14px"><span>2.6 of 4.2 GB</span><span>About 1 min left</span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 12px">
<div style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 50%; background: #2D2F36; color: #3DD68C; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></div>
<span style="font-weight: 400; color: #B3B6C0">Found Dev over Bluetooth</span>
</div>
<div style="display: flex; align-items: center; gap: 12px">
<div style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 50%; background: #2D2F36; color: #3DD68C; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></div>
<span style="font-weight: 400; color: #B3B6C0">Checked Dev's key</span>
</div>
<div style="display: flex; align-items: center; gap: 12px">
<div style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 50%; background: #4DA3FF; color: #0B1A2B; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"></path><circle cx="12" cy="19.5" r="1"></circle></svg></div>
<span style="font-weight: 700; color: #F2F3F5">Switched to Wi-Fi for speed</span>
</div>
</div>
<div style="display: flex; flex-direction: column">
<div style="min-height: 48px; border-bottom: 1px solid #383A42; display: flex; align-items: center; justify-content: space-between; gap: 12px"><span style="color: #B3B6C0">Encryption</span><span>AES-256</span></div>
<div style="min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 12px"><span style="color: #B3B6C0">If the link drops</span><span>Resumes by itself</span></div>
</div>
</div>
<div style="flex-shrink: 0; padding: 12px 20px 26px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<button style="height: 52px; padding: 0 18px; border-radius: 14px; border: 0; background: #2D2F36; color: #F2F3F5; font-weight: 600; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5v14M15 5v14"></path></svg><span>Pause</span></button>
<button style="height: 52px; padding: 0 18px; border-radius: 14px; border: 1px solid #FF6B6B; background: transparent; color: #FF6B6B; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px"><span>Cancel</span></button>
</div>
</div>
</body>
</html>
