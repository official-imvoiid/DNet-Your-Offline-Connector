<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Channel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
html{background:#1C1D22}
body{margin:0}
button{font:inherit;cursor:pointer}
input{font:inherit}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #1C1D22; color: #F2F3F5; font-family: 'Figtree', system-ui, sans-serif; font-size: 15px; line-height: 1.4; overflow: hidden">
<header style="flex-shrink: 0; min-height: 56px; box-sizing: border-box; padding: 6px 8px; display: flex; align-items: center; gap: 2px">
<button aria-label="Back" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 12px; background: transparent; color: #F2F3F5; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></button>

<div style="flex-grow: 1; min-width: 0; padding-left: 2px">
<h1 style="margin: 0; font-size: 18px; font-weight: 700; line-height: 1.25; display: flex; align-items: center; gap: 6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B3B6C0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9h14M5 15h14M10 4 8 20M16 4l-2 16"></path></svg><span>general</span></h1>
<div style="color: #B3B6C0; font-size: 13px">Trek Team, 5 nearby</div>
</div>
<button aria-label="Members" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 12px; background: transparent; color: #F2F3F5; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6 6 0 0 1 3.5 5.5"></path></svg></button>
<button aria-label="More options" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 12px; background: transparent; color: #F2F3F5; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle></svg></button>
</header>
<button style="flex-shrink: 0; height: 44px; padding: 0 16px; border: 0; background: #24252B; color: #F2F3F5; text-align: left; display: flex; align-items: center; gap: 10px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4DA3FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17v5M8 3h8l-1 6 3 4H6l3-4-1-6Z"></path></svg><span style="flex-grow: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Meet at gate 2, 6:00</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8E919C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></button>
<div style="flex-grow: 1; min-height: 0; padding: 14px 16px 6px; display: flex; flex-direction: column; justify-content: flex-end; gap: 16px">
<div style="display: flex; gap: 12px">
<div style="position: relative; width: 40px; height: 40px; flex-shrink: 0"><div style="width: 40px; height: 40px; border-radius: 20px; background: #2B4E7A; color: #CFE4FF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px">D</div></div>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; gap: 6px"><span style="font-weight: 700">Dev</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3DD68C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Verified" role="img" style="flex-shrink: 0"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6l-8-3Z"></path><path d="m9 12 2 2 4-4"></path></svg><span style="color: #8E919C; font-size: 12px">10:42</span></div>
<div style="display: flex; align-items: center; gap: 6px; color: #B3B6C0; font-size: 13px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 7 4 12l5 5M4 12h10a6 6 0 0 1 6 6v1"></path></svg><span>Mira: Which trail?</span></div>
<div>North ridge. Map attached.</div>
<div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: #24252B"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4DA3FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5Z"></path><path d="M14 3v5h5"></path></svg><span style="flex-grow: 1; font-weight: 600">north-ridge.gpx</span><span style="color: #B3B6C0; font-size: 13px">84 KB</span></div>
<div style="display: flex; gap: 6px; margin: -6px 0"><button aria-label="Heart reaction, 3" style="height: 44px; padding: 0; border: 0; background: transparent; color: #F2F3F5; display: flex; align-items: center"><span style="height: 30px; padding: 0 10px; border-radius: 15px; background: #1E2F45; box-shadow: inset 0 0 0 1px #4DA3FF; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4DA3FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10Z"></path></svg><span>3</span></span></button><button aria-label="Agree reaction, 2" style="height: 44px; padding: 0; border: 0; background: transparent; color: #F2F3F5; display: flex; align-items: center"><span style="height: 30px; padding: 0 10px; border-radius: 15px; background: #2D2F36; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg><span>2</span></span></button></div>
</div>
</div>
<div style="display: flex; gap: 12px">
<div style="position: relative; width: 40px; height: 40px; flex-shrink: 0"><div style="width: 40px; height: 40px; border-radius: 20px; background: #6B2F45; color: #FFD3E0; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px">M</div></div>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; gap: 6px"><span style="font-weight: 700">Mira</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3DD68C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Verified" role="img" style="flex-shrink: 0"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6l-8-3Z"></path><path d="m9 12 2 2 4-4"></path></svg><span style="color: #8E919C; font-size: 12px">10:43</span></div>
<div style="padding: 12px; border-radius: 16px; background: #24252B; display: flex; flex-direction: column; gap: 8px">
<div style="font-weight: 700">Start time?</div>
<button style="position: relative; height: 44px; padding: 0 12px; border: 0; border-radius: 10px; background: #2D2F36; color: #F2F3F5; overflow: hidden; display: flex; align-items: center; justify-content: space-between"><span style="position: absolute; left: 0; top: 0; width: 40%; height: 44px; background: #3A3C44"></span><span style="position: relative; font-weight: 500; display: flex; align-items: center; gap: 6px">5:30</span><span style="position: relative; font-size: 13px; color: #B3B6C0">40%</span></button>
<button style="position: relative; height: 44px; padding: 0 12px; border: 0; border-radius: 10px; background: #2D2F36; color: #F2F3F5; overflow: hidden; display: flex; align-items: center; justify-content: space-between"><span style="position: absolute; left: 0; top: 0; width: 60%; height: 44px; background: #244B78"></span><span style="position: relative; font-weight: 700; display: flex; align-items: center; gap: 6px">6:00<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></span><span style="position: relative; font-size: 13px; color: #F2F3F5">60%</span></button>
<div style="color: #B3B6C0; font-size: 12px">5 votes. Nobody sees who voted.</div>
</div>
</div>
</div>
<div style="display: flex; gap: 12px">
<div style="position: relative; width: 40px; height: 40px; flex-shrink: 0"><div style="width: 40px; height: 40px; border-radius: 20px; background: #4A3B78; color: #E0D6FF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px">N</div></div>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; gap: 6px"><span style="font-weight: 700">Noor</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3DD68C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Verified" role="img" style="flex-shrink: 0"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6l-8-3Z"></path><path d="m9 12 2 2 4-4"></path></svg><span style="color: #8E919C; font-size: 12px">10:44</span></div>
<div style="align-self: flex-start; padding: 6px 14px 6px 6px; border-radius: 28px; background: #24252B; display: flex; align-items: center; gap: 10px">
<button aria-label="Play voice message" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 50%; background: #4DA3FF; color: #0B1A2B; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5v14l11-7L8 5Z"></path></svg></button>
<div style="display: flex; align-items: center; gap: 3px"><span style="width: 3px; height: 10px; border-radius: 2px; background: #4DA3FF"></span><span style="width: 3px; height: 18px; border-radius: 2px; background: #4DA3FF"></span><span style="width: 3px; height: 24px; border-radius: 2px; background: #4DA3FF"></span><span style="width: 3px; height: 14px; border-radius: 2px; background: #4DA3FF"></span><span style="width: 3px; height: 20px; border-radius: 2px; background: #8E919C"></span><span style="width: 3px; height: 26px; border-radius: 2px; background: #8E919C"></span><span style="width: 3px; height: 12px; border-radius: 2px; background: #8E919C"></span><span style="width: 3px; height: 18px; border-radius: 2px; background: #8E919C"></span><span style="width: 3px; height: 8px; border-radius: 2px; background: #8E919C"></span><span style="width: 3px; height: 16px; border-radius: 2px; background: #8E919C"></span><span style="width: 3px; height: 22px; border-radius: 2px; background: #8E919C"></span><span style="width: 3px; height: 12px; border-radius: 2px; background: #8E919C"></span><span style="width: 3px; height: 16px; border-radius: 2px; background: #8E919C"></span><span style="width: 3px; height: 10px; border-radius: 2px; background: #8E919C"></span></div>
<span style="color: #B3B6C0; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px">0:14</span>
</div>
</div>
</div>
<div style="display: flex; gap: 12px">
<div style="position: relative; width: 40px; height: 40px; flex-shrink: 0"><div style="width: 40px; height: 40px; border-radius: 20px; background: #1F5A45; color: #C9F5DF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px">A</div></div>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; gap: 6px"><span style="font-weight: 700">Asha</span><span style="color: #8E919C; font-size: 12px">10:45</span></div>
<div>On my way.</div>
<div style="color: #8E919C; font-size: 12px; display: flex; align-items: center; gap: 6px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l3 2M9 2h6"></path></svg><span>Gone in 1 day</span></div>
</div>
</div>
</div>
<div style="flex-shrink: 0; padding: 8px 12px 16px">
<div style="display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 26px; background: #24252B">
<button aria-label="Attach or share" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 50%; background: transparent; color: #B3B6C0; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
<label for="msg" style="position: absolute; width: 1px; height: 1px; overflow: hidden">Message</label>
<input id="msg" type="text" placeholder="Message #general" style="flex-grow: 1; min-width: 0; height: 44px; border: 0; background: transparent; color: #F2F3F5; font-size: 16px; outline: none">
<button aria-label="Record a voice message" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 50%; background: #4DA3FF; color: #0B1A2B; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></button>
</div>
</div>
</div>
</body>
</html>
