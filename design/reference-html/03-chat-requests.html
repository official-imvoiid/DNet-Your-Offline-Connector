<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Chat requests</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
html{background:#1C1D22}
body{margin:0}
button{font:inherit;cursor:pointer}
input{font:inherit}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #1C1D22; color: #F2F3F5; font-family: 'Figtree', system-ui, sans-serif; font-size: 15px; line-height: 1.4; overflow: hidden">
<header style="flex-shrink: 0; min-height: 56px; box-sizing: border-box; padding: 6px 8px; display: flex; align-items: center; gap: 2px">
<button aria-label="Back" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 12px; background: transparent; color: #F2F3F5; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></button>

<div style="flex-grow: 1; min-width: 0; padding-left: 2px">
<h1 style="margin: 0; font-size: 18px; font-weight: 700; line-height: 1.25; display: flex; align-items: center; gap: 6px">Chat requests</h1>

</div>

</header>
<div style="flex-grow: 1; min-height: 0; padding: 4px 16px 0; display: flex; flex-direction: column; gap: 14px">
<div style="padding: 0 4px; color: #B3B6C0">Nobody can message you until you accept.</div>
<div style="padding: 14px; border-radius: 16px; background: #24252B; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 12px">
<div style="position: relative; width: 48px; height: 48px; flex-shrink: 0"><div style="width: 48px; height: 48px; border-radius: 24px; background: #6A5216; color: #FFE9A8; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 19px">K</div></div>
<div style="flex-grow: 1; min-width: 0">
<div style="display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px"><span>Kabir</span><span style="flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 8px; background: #3D3218; color: #F5C451; font-size: 12px; font-weight: 600">Not verified</span></div>
<div style="color: #B3B6C0; font-size: 13px">Also in Trek Team</div>
</div>
</div>
<div style="font-size: 15px">Hi, it is Kabir from the trek.</div>
<div style="display: flex; gap: 8px">
<button style="height: 46px; flex-grow: 1; padding: 0 18px; border-radius: 12px; border: 0; background: #4DA3FF; color: #0B1A2B; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px"><span>Accept</span></button>
<button style="height: 46px; flex-grow: 1; padding: 0 18px; border-radius: 12px; border: 0; background: #2D2F36; color: #F2F3F5; font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px"><span>Decline</span></button>
<button style="height: 46px; padding: 0 10px; border-radius: 12px; border: 0; background: transparent; color: #FF6B6B; font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px"><span>Block</span></button>
</div>
</div>
<div style="padding: 14px; border-radius: 16px; background: #24252B; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 12px">
<div style="position: relative; width: 48px; height: 48px; flex-shrink: 0"><div style="width: 48px; height: 48px; border-radius: 24px; background: #5A2A2A; color: #FFD6D6; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 19px">R</div></div>
<div style="flex-grow: 1; min-width: 0">
<div style="display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px"><span>red-falcon</span></div>
<div style="color: #F5C451; font-size: 13px">No spaces in common</div>
</div>
</div>

<div style="display: flex; gap: 8px">
<button style="height: 46px; flex-grow: 1; padding: 0 18px; border-radius: 12px; border: 0; background: #4DA3FF; color: #0B1A2B; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px"><span>Accept</span></button>
<button style="height: 46px; flex-grow: 1; padding: 0 18px; border-radius: 12px; border: 0; background: #2D2F36; color: #F2F3F5; font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px"><span>Decline</span></button>
<button style="height: 46px; padding: 0 10px; border-radius: 12px; border: 0; background: transparent; color: #FF6B6B; font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px"><span>Block</span></button>
</div>
</div>
<div style="color: #B3B6C0; font-size: 13px; font-weight: 600; padding: 6px 4px 0">Sent by you</div>
<div style="min-height: 60px; padding: 0 4px; display: flex; align-items: center; gap: 12px">
<div style="position: relative; width: 44px; height: 44px; flex-shrink: 0"><div style="width: 44px; height: 44px; border-radius: 22px; background: #1D5560; color: #C5F1F7; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px">R</div></div>
<div style="flex-grow: 1; min-width: 0">
<div style="font-weight: 700">Ravi</div>
<div style="color: #B3B6C0; font-size: 13px">Waiting for a reply</div>
</div>
<button style="height: 44px; padding: 0 14px; border-radius: 12px; border: 0; background: #2D2F36; color: #F2F3F5; font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px"><span>Cancel</span></button>
</div>
</div>
<div style="flex-shrink: 0; padding: 12px 20px 26px; color: #8E919C; font-size: 13px">People you decline are not told. People you block cannot ask again.</div>
</div>
</body>
</html>
