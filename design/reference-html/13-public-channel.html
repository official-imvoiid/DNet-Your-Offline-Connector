<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Public channel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
html{background:#1C1D22}
body{margin:0}
button{font:inherit;cursor:pointer}
input{font:inherit}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #1C1D22; color: #F2F3F5; font-family: 'Figtree', system-ui, sans-serif; font-size: 15px; line-height: 1.4; overflow: hidden">
<header style="flex-shrink: 0; min-height: 56px; box-sizing: border-box; padding: 6px 8px; display: flex; align-items: center; gap: 2px; border-bottom: 1px solid #383A42">
<button aria-label="Back" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 12px; background: transparent; color: #F2F3F5; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></button>
<div style="position: relative; width: 38px; height: 38px; flex-shrink: 0"><div style="width: 38px; height: 38px; border-radius: 13px; background: #6A5216; color: #FFE9A8; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#FFE9A8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10v4h3l8 4V6L6 10H3ZM17 9a4 4 0 0 1 0 6"></path></svg></div></div>
<div style="flex-grow: 1; min-width: 0; padding-left: 8px">
<h1 style="margin: 0; font-size: 18px; font-weight: 700; line-height: 1.25; display: flex; align-items: center; gap: 6px">City Signal</h1>
<div style="color: #B3B6C0; font-size: 13px">Public channel</div>
</div>
<button aria-label="More options" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 12px; background: transparent; color: #F2F3F5; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle></svg></button>
</header>
<div style="flex-grow: 1; min-height: 0; padding: 16px; display: flex; flex-direction: column; gap: 14px">
<article style="padding: 14px 14px 6px; border-radius: 16px; background: #24252B; display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 16px">Road closures tonight: Ring Road shuts at 10 pm. Use the east gate instead.</div>
<div style="display: flex; align-items: center; gap: 6px; color: #B3B6C0; font-size: 13px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#3DD68C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6l-8-3Z"></path><path d="m9 12 2 2 4-4"></path></svg><span style="flex-grow: 1">Signed by the owner</span><span>09:10</span></div>
<div style="display: flex; align-items: center; gap: 6px">
<button aria-label="Heart reaction, 24" style="height: 44px; padding: 0; border: 0; background: transparent; color: #F2F3F5; display: flex; align-items: center"><span style="height: 30px; padding: 0 10px; border-radius: 15px; background: #2D2F36; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10Z"></path></svg><span>24</span></span></button>
<button aria-label="Agree reaction, 9" style="height: 44px; padding: 0; border: 0; background: transparent; color: #F2F3F5; display: flex; align-items: center"><span style="height: 30px; padding: 0 10px; border-radius: 15px; background: #2D2F36; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg><span>9</span></span></button>
<div style="flex-grow: 1"></div>
<button style="height: 44px; padding: 0 4px; border: 0; background: transparent; color: #4DA3FF; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"></path></svg><span>12 comments</span></button>
</div>
</article>
<article style="padding: 14px; border-radius: 16px; background: #24252B; display: flex; flex-direction: column; gap: 10px">
<div style="height: 150px; border-radius: 12px; background: #2D2F36; color: #B3B6C0; font-size: 13px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="10" r="1.5"></circle><path d="m4 18 5-5 4 4 3-3 4 4"></path></svg><span>[Photo: route map]</span></div>
<div style="font-size: 16px">Updated route map for Sunday.</div>
<div style="display: flex; align-items: center; gap: 6px; color: #B3B6C0; font-size: 13px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#3DD68C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6l-8-3Z"></path><path d="m9 12 2 2 4-4"></path></svg><span style="flex-grow: 1">Signed by the owner</span><span>Yesterday</span></div>
</article>
</div>
<div style="flex-shrink: 0; padding: 12px 16px 26px; border-top: 1px solid #383A42; background: #24252B; display: flex; flex-direction: column; gap: 12px">
<div style="color: #B3B6C0; font-size: 13px">You follow privately. The owner cannot see who follows.</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button style="height: 48px; padding: 0 18px; border-radius: 12px; border: 0; background: #2D2F36; color: #F2F3F5; font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg><span>Following</span></button>
<button style="height: 48px; padding: 0 18px; border-radius: 12px; border: 0; background: #2D2F36; color: #F2F3F5; font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px"><span>Mute</span></button>
</div>
</div>
</div>
</body>
</html>
