<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>New chat</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
html{background:#1C1D22}
body{margin:0}
button{font:inherit;cursor:pointer}
input{font:inherit}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #1C1D22; color: #F2F3F5; font-family: 'Figtree', system-ui, sans-serif; font-size: 15px; line-height: 1.4; overflow: hidden">
<header style="flex-shrink: 0; min-height: 56px; box-sizing: border-box; padding: 6px 8px; display: flex; align-items: center; gap: 2px">
<button aria-label="Back" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 12px; background: transparent; color: #F2F3F5; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></button>

<div style="flex-grow: 1; min-width: 0; padding-left: 2px">
<h1 style="margin: 0; font-size: 18px; font-weight: 700; line-height: 1.25; display: flex; align-items: center; gap: 6px">New chat</h1>

</div>

</header>
<div style="flex-grow: 1; min-height: 0; padding: 4px 16px 0; display: flex; flex-direction: column; gap: 18px">
<div style="padding: 20px 16px 16px; border-radius: 20px; background: #24252B; display: flex; flex-direction: column; align-items: center; gap: 12px">
<div style="width: 148px; height: 148px; border-radius: 16px; background: #FFFFFF; color: #1C1D22; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px">
<svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#1C1D22" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><path d="M14 14h3v3h-3zM20 14v3M14 20h3M20 20h1"></path></svg>
<span style="font-size: 13px; font-weight: 600">[Your QR code]</span>
</div>
<div style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 17px">heron copper 74</div>
<div style="width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button style="height: 46px; padding: 0 18px; border-radius: 12px; border: 0; background: #4DA3FF; color: #0B1A2B; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px"><span>Share link</span></button>
<button style="height: 46px; padding: 0 18px; border-radius: 12px; border: 0; background: #2D2F36; color: #F2F3F5; font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px"><span>Copy</span></button>
</div>
</div>
<div style="display: flex; flex-direction: column">
<button style="min-height: 64px; padding: 0 4px; border: 0; border-bottom: 1px solid #383A42; background: transparent; color: #F2F3F5; text-align: left; display: flex; align-items: center; gap: 14px">
<div style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; background: #2D2F36; color: #4DA3FF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4V8Z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></div>
<div style="flex-grow: 1; min-width: 0">
<div style="font-weight: 700">Scan their code</div>
<div style="color: #B3B6C0; font-size: 13px">Point your camera at their screen</div>
</div>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8E919C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
</button>
<button style="min-height: 64px; padding: 0 4px; border: 0; border-bottom: 1px solid #383A42; background: transparent; color: #F2F3F5; text-align: left; display: flex; align-items: center; gap: 14px">
<div style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; background: #2D2F36; color: #4DA3FF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="2"></circle><path d="M7.8 7.8a6 6 0 0 0 0 8.4M16.2 7.8a6 6 0 0 1 0 8.4M4.9 4.9a10 10 0 0 0 0 14.2M19.1 4.9a10 10 0 0 1 0 14.2"></path></svg></div>
<div style="flex-grow: 1; min-width: 0">
<div style="font-weight: 700">Find nearby</div>
<div style="color: #B3B6C0; font-size: 13px">Works with no internet</div>
</div>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8E919C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
</button>
<button style="min-height: 64px; padding: 0 4px; border: 0; border-bottom: 1px solid #383A42; background: transparent; color: #F2F3F5; text-align: left; display: flex; align-items: center; gap: 14px">
<div style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; background: #2D2F36; color: #4DA3FF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a8 8 0 0 1 0 8M10 5a12 12 0 0 1 0 14M14 8a8 8 0 0 1 0 8"></path></svg></div>
<div style="flex-grow: 1; min-width: 0">
<div style="font-weight: 700">Tap phones together</div>
<div style="color: #B3B6C0; font-size: 13px">Hold the two phones back to back</div>
</div>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8E919C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
</button>
<button style="min-height: 64px; padding: 0 4px; border: 0; background: transparent; color: #F2F3F5; text-align: left; display: flex; align-items: center; gap: 14px">
<div style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; background: #2D2F36; color: #4DA3FF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg></div>
<div style="flex-grow: 1; min-width: 0">
<div style="font-weight: 700">Paste an invite link</div>
<div style="color: #B3B6C0; font-size: 13px">For someone who is far away</div>
</div>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8E919C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
</button>
</div>
</div>
<div style="flex-shrink: 0; padding: 12px 20px 26px; color: #8E919C; font-size: 13px">They need to accept before either of you can send a message.</div>
</div>
</body>
</html>
