<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Share sheet</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
html{background:#1C1D22}
body{margin:0}
button{font:inherit;cursor:pointer}
input{font:inherit}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #1C1D22; color: #F2F3F5; font-family: 'Figtree', system-ui, sans-serif; font-size: 15px; line-height: 1.4; overflow: hidden">
<div style="flex-grow: 1; min-height: 0; opacity: 0.3; display: flex; flex-direction: column">
<div style="padding: 20px 20px 14px; display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 700"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9h14M5 15h14M10 4 8 20M16 4l-2 16"></path></svg><span>general</span></div>
<div style="flex-grow: 1; padding: 16px; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px">
<div style="align-self: flex-start; padding: 10px 14px; border-radius: 20px 20px 20px 6px; background: #2D2F36">North ridge. Map attached.</div>
<div style="align-self: flex-end; padding: 10px 14px; border-radius: 20px 20px 6px 20px; background: #244B78">On my way.</div>
</div>
</div>
<div style="flex-shrink: 0; padding: 10px 16px 26px; border-radius: 28px 28px 0 0; background: #24252B; display: flex; flex-direction: column; gap: 16px">
<div style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #4A4D57"></div>
<div style="display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; padding-left: 4px; font-size: 20px; font-weight: 800">Share</h1>
<button aria-label="Close" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 12px; background: transparent; color: #F2F3F5; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px 8px">
<button style="padding: 0; border: 0; background: transparent; color: #F2F3F5; font-size: 12px; font-weight: 500; display: flex; flex-direction: column; align-items: center; gap: 8px"><span style="width: 56px; height: 56px; border-radius: 50%; background: #2D2F36; color: #4DA3FF; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="10" r="1.5"></circle><path d="m4 18 5-5 4 4 3-3 4 4"></path></svg></span><span>Photo</span></button>
<button style="padding: 0; border: 0; background: transparent; color: #F2F3F5; font-size: 12px; font-weight: 500; display: flex; flex-direction: column; align-items: center; gap: 8px"><span style="width: 56px; height: 56px; border-radius: 50%; background: #2D2F36; color: #4DA3FF; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5Z"></path><path d="M14 3v5h5"></path></svg></span><span>File</span></button>
<button style="padding: 0; border: 0; background: transparent; color: #F2F3F5; font-size: 12px; font-weight: 500; display: flex; flex-direction: column; align-items: center; gap: 8px"><span style="width: 56px; height: 56px; border-radius: 50%; background: #2D2F36; color: #4DA3FF; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></span><span>Voice</span></button>
<button style="padding: 0; border: 0; background: transparent; color: #F2F3F5; font-size: 12px; font-weight: 500; display: flex; flex-direction: column; align-items: center; gap: 8px"><span style="width: 56px; height: 56px; border-radius: 50%; background: #2D2F36; color: #4DA3FF; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"></path></svg></span><span>Poll</span></button>
<button style="padding: 0; border: 0; background: transparent; color: #F2F3F5; font-size: 12px; font-weight: 500; display: flex; flex-direction: column; align-items: center; gap: 8px"><span style="width: 56px; height: 56px; border-radius: 50%; background: #2D2F36; color: #4DA3FF; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></span><span>Contact</span></button>
<button style="padding: 0; border: 0; background: transparent; color: #F2F3F5; font-size: 12px; font-weight: 500; display: flex; flex-direction: column; align-items: center; gap: 8px"><span style="width: 56px; height: 56px; border-radius: 50%; background: #2D2F36; color: #4DA3FF; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6-5.5-6-11a6 6 0 0 1 12 0c0 5.5-6 11-6 11Z"></path><circle cx="12" cy="10" r="2"></circle></svg></span><span>Location</span></button>
<button style="padding: 0; border: 0; background: transparent; color: #F2F3F5; font-size: 12px; font-weight: 500; display: flex; flex-direction: column; align-items: center; gap: 8px"><span style="width: 56px; height: 56px; border-radius: 50%; background: #2D2F36; color: #4DA3FF; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l3 2M9 2h6"></path></svg></span><span>View once</span></button>
<button style="padding: 0; border: 0; background: transparent; color: #F2F3F5; font-size: 12px; font-weight: 500; display: flex; flex-direction: column; align-items: center; gap: 8px"><span style="width: 56px; height: 56px; border-radius: 50%; background: #2D2F36; color: #4DA3FF; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><path d="M14 14h3v3h-3zM20 14v3M14 20h3M20 20h1"></path></svg></span><span>Camera code</span></button>
</div>
<button style="min-height: 64px; padding: 0 14px; border: 0; border-radius: 16px; background: #1E2F45; color: #F2F3F5; text-align: left; display: flex; align-items: center; gap: 12px">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4DA3FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"></path><circle cx="12" cy="19.5" r="1"></circle></svg>
<div style="flex-grow: 1; min-width: 0">
<div style="font-weight: 700">Send a big file nearby</div>
<div style="color: #B3B6C0; font-size: 13px">Goes direct at Wi-Fi speed, any size</div>
</div>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B3B6C0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
</button>
<div style="min-height: 48px; padding: 0 4px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
<span>Remove location from photos</span>
<button role="switch" aria-checked="true" aria-label="Remove location from photos" style="width: 52px; height: 44px; flex-shrink: 0; padding: 0; border: 0; background: transparent; display: flex; align-items: center"><span data-on="#4DA3FF" data-off="#4A4D57" style="width: 52px; height: 30px; box-sizing: border-box; padding: 3px; border-radius: 15px; background: #4DA3FF; display: flex; justify-content: flex-end"><span style="width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF"></span></span></button>
</div>
</div>
</div>
</body>
</html>
