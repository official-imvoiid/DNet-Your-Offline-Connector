<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Direct message</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
html{background:#1C1D22}
body{margin:0}
button{font:inherit;cursor:pointer}
input{font:inherit}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #1C1D22; color: #F2F3F5; font-family: 'Figtree', system-ui, sans-serif; font-size: 15px; line-height: 1.4; overflow: hidden">
<header style="flex-shrink: 0; min-height: 56px; box-sizing: border-box; padding: 6px 8px; display: flex; align-items: center; gap: 2px; border-bottom: 1px solid #383A42">
<button aria-label="Back" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 12px; background: transparent; color: #F2F3F5; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></button>
<div style="position: relative; width: 38px; height: 38px; flex-shrink: 0"><div style="width: 38px; height: 38px; border-radius: 19px; background: #6B2F45; color: #FFD3E0; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px">M</div><span style="position: absolute; right: -2px; bottom: -2px; width: 12px; height: 12px; box-sizing: border-box; border: 3px solid #1C1D22; border-radius: 50%; background: #3DD68C"></span></div>
<div style="flex-grow: 1; min-width: 0; padding-left: 8px">
<h1 style="margin: 0; font-size: 18px; font-weight: 700; line-height: 1.25; display: flex; align-items: center; gap: 6px"><span>Mira</span><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#3DD68C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Verified" role="img" style="flex-shrink: 0"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6l-8-3Z"></path><path d="m9 12 2 2 4-4"></path></svg></h1>
<div style="color: #B3B6C0; font-size: 13px">Nearby, on Bluetooth</div>
</div>
<button aria-label="Call Mira" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 12px; background: transparent; color: #F2F3F5; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a1 1 0 0 1-1 1A16 16 0 0 1 4 5a1 1 0 0 1 1-1Z"></path></svg></button>
<button aria-label="More options" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 12px; background: transparent; color: #F2F3F5; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle></svg></button>
</header>
<div style="flex-grow: 1; min-height: 0; padding: 12px 16px; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px">
<div style="align-self: center; margin-bottom: 6px; padding: 6px 12px; border-radius: 12px; background: #24252B; color: #B3B6C0; font-size: 13px; display: flex; align-items: center; gap: 8px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3DD68C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg><span>Encrypted. Only you two can read this.</span></div>
<div style="align-self: flex-start; max-width: 280px; padding: 10px 14px; border-radius: 20px 20px 20px 6px; background: #2D2F36; display: flex; flex-direction: column; gap: 2px">
<div>Are you coming on Sunday?</div>
<div style="align-self: flex-end; color: #B3B6C0; font-size: 12px">10:40</div>
</div>
<div style="align-self: flex-end; max-width: 280px; padding: 10px 14px; border-radius: 20px 20px 6px 20px; background: #244B78; display: flex; flex-direction: column; gap: 2px">
<div>Yes. Leaving at 5:30.</div>
<div style="align-self: flex-end; color: #C9DCF2; font-size: 12px; display: flex; align-items: center; gap: 6px"><span>10:41</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9CCBFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Read" role="img"><path d="m2 12 4 4 8-9M11 16l1 1 9-10"></path></svg></div>
</div>
<div style="align-self: flex-start; padding: 6px 14px 6px 6px; border-radius: 28px; background: #2D2F36; display: flex; align-items: center; gap: 10px">
<button aria-label="Play voice message" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 50%; background: #4DA3FF; color: #0B1A2B; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5v14l11-7L8 5Z"></path></svg></button>
<div style="display: flex; align-items: center; gap: 3px"><span style="width: 3px; height: 10px; border-radius: 2px; background: #4DA3FF"></span><span style="width: 3px; height: 18px; border-radius: 2px; background: #4DA3FF"></span><span style="width: 3px; height: 24px; border-radius: 2px; background: #4DA3FF"></span><span style="width: 3px; height: 14px; border-radius: 2px; background: #4DA3FF"></span><span style="width: 3px; height: 20px; border-radius: 2px; background: #8E919C"></span><span style="width: 3px; height: 26px; border-radius: 2px; background: #8E919C"></span><span style="width: 3px; height: 12px; border-radius: 2px; background: #8E919C"></span><span style="width: 3px; height: 18px; border-radius: 2px; background: #8E919C"></span><span style="width: 3px; height: 8px; border-radius: 2px; background: #8E919C"></span><span style="width: 3px; height: 16px; border-radius: 2px; background: #8E919C"></span><span style="width: 3px; height: 22px; border-radius: 2px; background: #8E919C"></span><span style="width: 3px; height: 12px; border-radius: 2px; background: #8E919C"></span><span style="width: 3px; height: 16px; border-radius: 2px; background: #8E919C"></span><span style="width: 3px; height: 10px; border-radius: 2px; background: #8E919C"></span></div>
<span style="color: #B3B6C0; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px">0:14</span>
</div>
<div style="align-self: flex-end; max-width: 280px; padding: 10px 14px; border-radius: 20px 20px 6px 20px; background: #244B78; display: flex; flex-direction: column; gap: 2px">
<div>Bringing the radio too.</div>
<div style="align-self: flex-end; color: #C9DCF2; font-size: 12px; display: flex; align-items: center; gap: 6px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l3 2M9 2h6"></path></svg><span>Gone in 1 day</span><span>10:45</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9CCBFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Read" role="img"><path d="m2 12 4 4 8-9M11 16l1 1 9-10"></path></svg></div>
</div>
</div>
<div style="flex-shrink: 0; padding: 8px 12px 16px">
<div style="display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 26px; background: #24252B">
<button aria-label="Attach or share" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 50%; background: transparent; color: #B3B6C0; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
<label for="msg" style="position: absolute; width: 1px; height: 1px; overflow: hidden">Message</label>
<input id="msg" type="text" placeholder="Message Mira" style="flex-grow: 1; min-width: 0; height: 44px; border: 0; background: transparent; color: #F2F3F5; font-size: 16px; outline: none">
<button aria-label="Record a voice message" style="width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 50%; background: #4DA3FF; color: #0B1A2B; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></button>
</div>
</div>
</div>
</body>
</html>
