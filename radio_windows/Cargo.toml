[package]
name = "dnet_radio"
version = "0.1.0"
edition = "2021"
description = "Bluetooth, Wi-Fi Direct, the microphone and the speaker for DNet on Windows. Moves frames, makes a network for them and records sound; knows nothing about what any of it holds."
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Devices_Bluetooth",
    "Devices_Bluetooth_Advertisement",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Devices_Enumeration",
    "Devices_Geolocation",
    "Devices_WiFiDirect",
    "Devices_Radios",
    "Foundation",
    "Foundation_Collections",
    "Graphics_Imaging",
    "Media_Capture",
    "Media_Capture_Frames",
    "Media_Core",
    "Media_MediaProperties",
    "Media_Playback",
    "Networking",
    "Security_Credentials",
    "Storage",
    "Storage_Search",
    "Security_Cryptography",
    "Storage_Streams",
    "System",
    # The microphone and the speaker during a call (WASAPI).
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    # Sharing the screen or a window in a call (Windows Graphics Capture),
    # squeezed into JPEG by Windows' own encoder (WIC).
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_System_Ole",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
strip = true
